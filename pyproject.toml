[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gridmap"
description = "Spatial document graph engine for credential detection in spreadsheets"
requires-python = ">=3.9"
dependencies = ["openpyxl"]
dynamic = ["version"]
license = "MIT OR Apache-2.0"
authors = [
    {name = "Dipan Ghosh"},
]
keywords = ["spreadsheet", "credential-detection", "spatial-analysis", "xlsx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/dipanghosh/gridmap"
Repository = "https://github.com/dipanghosh/gridmap"
Changelog = "https://github.com/dipanghosh/gridmap/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/gridmap-py/Cargo.toml"
python-source = "python"
module-name = "gridmap._core"
features = ["pyo3/extension-module"]
